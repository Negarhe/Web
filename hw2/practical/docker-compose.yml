services:
  legacy:
    image: ghcr.io/mccutchen/go-httpbin
    command: ["-host", "0.0.0.0", "-port", "8081"]
    networks:
      - internal
    restart: unless-stopped

  proxy:
    build: ./proxy
    ports:
      - "${PROXY_PORT:-80}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      UPSTREAM_URL: http://legacy:8081
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret}
      AUTH_USERNAME: ${AUTH_USERNAME:-student}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-student}
    depends_on:
      - legacy
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
